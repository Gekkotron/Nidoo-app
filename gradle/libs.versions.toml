[versions]
vico = "2.1.3"
androidxCore = "1.18.0"
coil = "3.5.0"
media3 = "1.11.1"
kotlin = "2.4.20"
coroutines = "1.11.0"
serialization = "1.11.0"
kover = "0.9.9"
junit = "6.1.3"
agp = "9.5.0"
ksp = "2.3.12"
room = "2.8.5"
hilt = "2.60.1"
androidxHilt = "1.3.0"
reorderable = "3.1.0"
composeBom = "2026.06.01"
# Compose Multiplatform for the iOS app. Its Android artifacts map to androidx.compose 1.11.x,
# the line composeBom pins, so the Android app keeps its Compose versions.
composeMultiplatform = "1.11.1"
screenshot = "0.0.1-alpha17"
# Koin: DI on Android and iOS, alongside Hilt while modules move (iOS spec §9).
koin = "4.2.2"
activity = "1.13.0"
lifecycle = "2.10.0"
navigation3 = "1.1.7"
jetbrainsNavigation3 = "1.1.2"
robolectric = "4.17"
junit4 = "4.13.2"
androidxTestExtJunit = "1.3.0"
hivemq = "1.4.0"
moquette = "0.17"
datastore = "1.2.1"
# Already resolved by :app through DataStore and OkHttp; pinned for :core:data's common code.
okio = "3.17.0"
cryptographyKotlin = "0.6.0"
kotlinxIo = "0.9.1"
atomicfu = "0.33.0"
androidxTestRunner = "1.7.0"
camerax = "1.6.2"
zxing = "3.5.3"
googleServices = "4.5.0"
firebaseBom = "34.19.0"
playServicesLocation = "21.3.0"
work = "2.12.0"
glance = "1.2.0"
firebaseCrashlyticsPlugin = "3.0.8"
aboutlibraries = "15.2.0"
# Not in the Firebase BoM.
firebaseAppDistribution = "16.0.0-beta20"
athenaGatewayClient = "2.0.0"
# Ktor for the iOS HTTP clients (Darwin engine) and common code; no OkHttp engine (it would force OkHttp 5 on Android).
ktor = "3.6.1"
# Test-only; matches the OkHttp 4.12 that athena-gateway-client brings.
okhttpMockwebserver = "4.12.0"

[libraries]
vico-compose-m3 = { module = "com.patrykandpatrick.vico:compose-m3", version.ref = "vico" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
