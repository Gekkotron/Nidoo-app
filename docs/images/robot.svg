<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <title>Nidoo robot vacuum icon: cleaning a room row by row, returning to its dock and charging</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #E8ECFF; }
    .name { font-size: 30px; font-weight: 700; }
    .state { font-size: 18px; opacity: .72; }
    .w { opacity: 0; animation-duration: 14s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .clean { animation-name: clean; }
    .ret { animation-name: ret; }
    .dock { animation-name: dock; }
    .tint { animation-name: tint; }
    @keyframes clean { 0% { opacity: 1; } 56.07% { opacity: 1; } 58.21% { opacity: 0; } 98.93% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes ret { 0% { opacity: 0; } 56.07% { opacity: 0; } 58.21% { opacity: 1; } 77.5% { opacity: 1; } 79.64% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes dock { 0% { opacity: 0; } 77.5% { opacity: 0; } 79.64% { opacity: 1; } 98.93% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes tint { 0% { opacity: 1; } 77.5% { opacity: 1; } 79.64% { opacity: 0; } 98.93% { opacity: 0; } 100% { opacity: 1; } }
    .trail { animation: trail 14s linear infinite; }
    @keyframes trail { 0% { stroke-dashoffset: 70; } 57.14% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
    .drive { offset-path: path('M5 5.5H19V10H5V14.5H19V19H5'); offset-rotate: auto; animation: drive 14s linear infinite; }
    @keyframes drive { 0% { offset-distance: 0%; } 57.14% { offset-distance: 100%; } 100% { offset-distance: 100%; } }
    .home { animation: home 14s linear infinite; }
    @keyframes home {
      0%, 57.14% { transform: translate(0px, 0px); animation-timing-function: cubic-bezier(.45, 0, .55, 1); }
      73.21%, 100% { transform: translate(13px, 10.5px); }
    }
    .bolt { animation: bolt 1.8s ease-in-out infinite alternate; }
    @keyframes bolt { from { opacity: .4; } to { opacity: .9; } }
  </style>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D2B55"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="on" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC457" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFC457" stop-opacity=".04"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="359" height="199" rx="24" fill="url(#card)"/>
  <rect class="w tint" x=".5" y=".5" width="359" height="199" rx="24" fill="url(#on)"/>
  <rect x=".5" y=".5" width="359" height="199" rx="24" fill="none" stroke="rgba(255,255,255,.09)"/>

  <g transform="translate(30 40) scale(5)">
    <rect x="1.5" y="2" width="21" height="20.5" rx="3" fill="none" stroke="#E8ECFF" stroke-width="1" opacity=".28"/>

    <g class="w clean">
      <path class="trail" d="M5 5.5H19V10H5V14.5H19V19H5" fill="none" stroke="#FFC457" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" opacity=".16" stroke-dasharray="70 70"/>
      <g class="drive">
        <circle r="3.1" fill="#FFC457" fill-opacity=".35" stroke="#FFC457" stroke-width="1.3"/>
        <path d="M2.05 -2.05A2.9 2.9 0 0 1 2.05 2.05" fill="none" stroke="#FFC457" stroke-width="1.3" stroke-linecap="round"/>
        <circle r="1.05" fill="#FFC457"/>
      </g>
    </g>

    <g class="w ret">
      <rect x="18" y="16.5" width="4" height="5" rx="1" fill="#E8ECFF" fill-opacity=".22" stroke="#E8ECFF" stroke-width="1.6" stroke-linejoin="round"/>
      <g class="home">
        <g transform="translate(6.5 8.5) rotate(39)">
          <circle r="3.1" fill="#FFC457" fill-opacity=".35" stroke="#FFC457" stroke-width="1.3"/>
          <path d="M2.05 -2.05A2.9 2.9 0 0 1 2.05 2.05" fill="none" stroke="#FFC457" stroke-width="1.3" stroke-linecap="round"/>
          <circle r="1.05" fill="#FFC457"/>
        </g>
      </g>
    </g>

    <g class="w dock">
      <rect x="18" y="16.5" width="4" height="5" rx="1" fill="#6FF0BF" fill-opacity=".22" stroke="#6FF0BF" stroke-width="1.4"/>
      <g transform="translate(19.5 19) rotate(39)">
        <circle r="3.1" fill="#E8ECFF" fill-opacity=".22" stroke="#E8ECFF" stroke-width="1.3"/>
        <path d="M2.05 -2.05A2.9 2.9 0 0 1 2.05 2.05" fill="none" stroke="#E8ECFF" stroke-width="1.3" stroke-linecap="round"/>
        <circle r="1.05" fill="#E8ECFF"/>
      </g>
      <path class="bolt" d="M12.3 8 L10 12 h2.5 l-.8 3.8 L14.4 11.5 H11.9 L12.8 8z" fill="#6FF0BF"/>
    </g>
  </g>

  <text class="name" x="180" y="95">Roborock</text>
  <g class="state">
    <text class="w clean" x="180" y="128">Cleaning</text>
    <text class="w ret" x="180" y="128">Returning</text>
    <text class="w dock" x="180" y="128">Docked</text>
  </g>
</svg>
