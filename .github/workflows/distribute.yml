name: Build & upload to Firebase App Distribution

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v5

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        # Accept the secret as raw JSON or base64, and fail loudly if it is neither.
        run: |
          if printf '%s' "$GOOGLE_SERVICES_JSON" | jq -e . >/dev/null 2>&1; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode 2>/dev/null | jq -e . >/dev/null 2>&1; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          else
            echo "::error::GOOGLE_SERVICES_JSON is neither JSON nor base64-encoded JSON"; exit 1
          fi
          jq -r '.client[].client_info.android_client_info.package_name' app/google-services.json

      # The Firebase app ID lives in google-services.json next to the package it belongs to, so take it from
      # there rather than from a second secret that can drift (a mismatch is a 400 "invalid argument" on upload).
      - name: Resolve Firebase app ID
        id: firebase
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          app_id=$(jq -r '.client[] | select(.client_info.android_client_info.package_name == "com.gekkotron.nidoo")
            | .client_info.mobilesdk_app_id' app/google-services.json)
          if [ -z "$app_id" ]; then echo "::error::no com.gekkotron.nidoo client in google-services.json"; exit 1; fi
          echo "app ID: $app_id"
          if [ "$app_id" = "$FIREBASE_APP_ID" ]; then echo "FIREBASE_APP_ID secret matches"; else echo "::warning::FIREBASE_APP_ID secret differs from google-services.json; using google-services.json"; fi
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"

      - name: Increase app version
        run: ./gradlew increaseBuildNumber -PversionCode=$GITHUB_RUN_NUMBER

      - name: Prepare signing config
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/nidoo-release.jks"
          umask 077
          cat > app/signing.properties <<EOF
          storeFile=$RUNNER_TEMP/nidoo-release.jks
          keyAlias=$SIGNING_ALIAS
          storePassword=$SIGNING_PASSWORD
          keyPassword=$SIGNING_PASSWORD
          EOF

      - name: Build signed release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ steps.firebase.outputs.app_id }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: Testers
          file: app/build/outputs/apk/release/app-release.apk

      - name: Commit updated version code
        uses: EndBug/add-and-commit@v9
        with:
          author_name: Gekkotron
          author_email: 60887050+Gekkotron@users.noreply.github.com
          message: "Update version code"
          add: "app/version.properties"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
